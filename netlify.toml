[build]
  # La versión pública no incluye las fotografías de autopsia (sin permiso de publicación): solo los facsímiles.
  command = "npm run build:public"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sin X-Frame-Options ni frame-ancestors restrictivos, para que la web institucional pueda insertar el atlas en un iframe.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los archivos con huella en el nombre no cambian nunca.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
